name: Prepare private release draft

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful Desktop checks run with release candidate artifact
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
    steps:
      - name: Validate and retrieve candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN_ID" > run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('run.json').read_text())
          assert run['conclusion'] == 'success'
          assert run['path'] == '.github/workflows/release.yml'
          assert run['event'] == 'workflow_dispatch'
          assert run['head_repository']['full_name'] == os.environ['GH_REPO']
          PY
          gh run download "$CANDIDATE_RUN_ID" --name JustDLSS5-release-candidate --dir candidate
          python - <<'PY'
          import os
          from pathlib import Path
          matches = list(Path('candidate').rglob('SHA256SUMS.txt'))
          assert len(matches) == 1, 'Expected exactly one release candidate'
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'CANDIDATE_DIR={matches[0].resolve().parent}\n')
          PY
      - name: Verify checksums and prepare notes
        shell: bash
        run: |
          set -euo pipefail
          cd "$CANDIDATE_DIR"
          sha256sum -c SHA256SUMS.txt
          python - <<'PY'
          import json, os, re, zipfile
          from pathlib import Path
          run = json.loads((Path(os.environ['GITHUB_WORKSPACE']) / 'run.json').read_text())
          info = json.loads(Path('BUILD-INFO.json').read_text())
          assert info['commit'] == run['head_sha']
          assert str(info['workflow']) == os.environ['CANDIDATE_RUN_ID']
          version = info['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          with zipfile.ZipFile(f'JustDLSS5-v{version}-windows-x64.zip') as z:
              assert json.loads(z.read('JustDLSS5/BUILD-INFO.json')) == info
              for name in ('LGPL-3.0-only.txt', 'GPL-3.0-only.txt'):
                  assert z.read('JustDLSS5/LICENSES/qtbase/LICENSES/' + name)
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f"VERSION={version}\nCOMMIT={info['commit']}\n")
          PY
      - name: Create draft only
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/contents/docs/RELEASE-v$VERSION.md?ref=$COMMIT" --jq .content | base64 --decode > notes.md
          printf '\nBuild record: https://github.com/%s/actions/runs/%s\n' "$GH_REPO" "$CANDIDATE_RUN_ID" >> notes.md
          gh release create "v$VERSION" "$CANDIDATE_DIR"/*.zip "$CANDIDATE_DIR/SHA256SUMS.txt" "$CANDIDATE_DIR/BUILD-INFO.json" \
            --draft --prerelease --target "$COMMIT" \
            --title "JustDLSS5 v$VERSION · 玩家测试版" --notes-file notes.md
